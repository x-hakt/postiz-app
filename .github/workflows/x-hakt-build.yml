# x-hakt: build the patched Postiz image for planner.x-hakt.com (bosun-x PLN-20).
# Tag a commit on x-hakt/v2.24.0-patches as x-hakt-v2.24.0-N to test and build it.
name: "x-hakt build"

on:
  workflow_dispatch:
  push:
    tags:
      - 'x-hakt-*'

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable && pnpm install --frozen-lockfile --ignore-scripts
      - run: npx jest -c libraries/nestjs-libraries/jest.config.ts

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Build and push (amd64)
        run: |
          docker buildx build --platform linux/amd64 \
            -f Dockerfile.dev \
            -t ghcr.io/x-hakt/postiz-app:${{ github.ref_name }} \
            --build-arg NEXT_PUBLIC_VERSION=${{ github.ref_name }} \
            --pull --provenance=false --sbom=false \
            --push .
